<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 50px auto; padding: 20px; }
    input, button { font-size: 16px; padding: 9px; margin: 6px 0; }
    #answer { font-weight: bold; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Factorial Calculator</h1>
  <label for="number">Enter a non-negative integer:</label><br>
  <input id="number" type="number" step="1" min="0" value="5">
  <button id="calculate">Calculate</button>
  <p id="answer">Answer: </p>

  <script>
    document.getElementById("calculate").addEventListener("click", function () {
      const n = Number(document.getElementById("number").value);
      const answer = document.getElementById("answer");

      if (!Number.isInteger(n) || n < 0) {
        answer.textContent = "Answer: Unspecified";
        return;
      }

      let factorial = 1;
      for (let i = 1; i <= n; i++) {
        factorial *= i;
      }
      answer.textContent = "Answer: " + factorial;
    });
  </script>
</body>
</html>
